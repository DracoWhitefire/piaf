[package]
name = "piaf"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
description = "A library for reading and interpreting display capability data (EDID)."
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/DracoWhitefire/piaf"
keywords = ["edid", "display", "hdmi", "cea861", "no-std"]
categories = ["hardware-support", "embedded", "parser-implementations"]

[features]
default = ["std"]
std = []
alloc = []
serde = ["dep:serde", "bitflags/serde", "display-types/serde"]

[dependencies]
display-types = { path = "../display-types" }
serde = { version = "1.0", optional = true, features = ["derive"] }
bitflags = "2.4"
thiserror = "2.0"

[dev-dependencies]
serde_json = { version = "1.0", optional = false }
